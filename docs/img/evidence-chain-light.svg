<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="592" viewBox="0 0 1000 592" role="img" aria-labelledby="t d">
<title id="t">From a number on this page back to the raw data</title>
<desc id="d">Chain of five steps, each with a check. A number in the README comes from the statistics file; CI compares every table number with the data. The statistics come from one row per sample; new code recomputes every point estimate. Each row names the scorer commit and hash. The generated designs have a manifest with hashes. The pinned inputs are in the frozen plan, which has a timestamp. Each proved-wrong pass also has a witness trace.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="591" rx="14" fill="#fcfcfb" stroke="#dcdad3"/>
<text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">From a number on this page back to the raw data</text>
<text x="30" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Each step is a file in this repository, and each step has a check.</text>
<text x="30" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2a78d6" text-anchor="start">THE CHAIN</text>
<text x="470" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2a78d6" text-anchor="start">THE CHECK ON THAT STEP</text>

<rect x="470" y="98" width="8" height="60" rx="4" fill="#0ca30c"/>
<text x="494" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">CI compares every table number with the data files</text>
<text x="494" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">verify/check.py, on each push</text>

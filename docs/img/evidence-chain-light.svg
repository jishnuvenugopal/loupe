<text x="84" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">scores/&lt;arm&gt;.jsonl</text>
<line x1="431" y1="288.0" x2="469" y2="288.0" stroke="#8a8880" stroke-width="1.6" stroke-dasharray="4 4"/>
<rect x="470" y="258" width="500" height="60" rx="10" fill="#f3f2ee" stroke="#dcdad3" stroke-width="1"/>

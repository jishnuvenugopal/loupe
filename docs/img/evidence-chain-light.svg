<circle cx="58" cy="128.0" r="13" fill="none" stroke="#2a78d6" stroke-width="2"/>
<text x="58" y="133.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">1</text>
<text x="84" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#0b0b0b" text-anchor="start">A number on this page</text>
<text x="84" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">README.md, for example 33.3 [17.1, 50.6]</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="t d">
<title id="t">The order of events</title>
<desc id="d">Timeline: scorer frozen 18 Oct; plan frozen and timestamped in Bitcoin block 972099 on 19 Oct; main generation 19 Oct; gate G2 stop and amendment A19; primary results 21 Oct; GRPO test to 11 Nov; blind 40 unblinded with AI labels on 13 Nov.</desc>

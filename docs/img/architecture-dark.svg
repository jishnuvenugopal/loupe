<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="t d">
<title id="t">The system in one picture</title>
<desc id="d">Five layers. The author gives a question, a brief for each session, a decision at each gate and numbered amendments. AI agent sessions on a DGX Spark and on a Mac do the work. They run vLLM, Icarus, Verilator, Yosys, SymbiYosys, TRL and OpenTimestamps. The record in git holds the plan and proofs, pinned inputs, per-sample scores, tables, witnesses, the log and receipts. The checks read the record: scorer hash, gates, plan review, recompute and CI.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="659" rx="14" fill="#1a1a19" stroke="#3a3a37"/>
<text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f0efec" text-anchor="start">The system in one picture</text>
<text x="30" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">People decide, agents work, tools give evidence, git keeps the record, checks read the record.</text>
<rect x="20" y="78" width="960" height="86" rx="12" fill="#1d2b3d"/>
<text x="34" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3987e5" text-anchor="start">THE AUTHOR</text>
